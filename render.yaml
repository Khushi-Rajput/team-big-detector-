services:
  - type: web
    name: ai-resume-analyser
    env: python
    plan: free
    buildCommand: "cd Client && npm install && npm run build && cd ../Server && pip install -r requirements.txt"
    startCommand: "cd Server && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
